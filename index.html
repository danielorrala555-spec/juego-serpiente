<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="serpiente.css">
    <title>Juego de la Serpiente</title>
</head>

<body onload="dibujrTablero()">

    

    <div class="layout">

        <!-- MENÚ LATERAL -->
        <section class="menuOpciones" id="menuLateral">

            <aside class="sidebar">

                <div class="logo">
                    <div class="logo-serpiente">S</div>
                    <h2>SNAKE</h2>
                    <span>THE LEGEND</span>
                </div>

                <nav class="menu">

                    <a href="#" class="activo">
                        <span>🏠</span>
                        Inicio
                    </a>

                    <a href="#">
                        <span>🎭</span>
                        Skins
                    </a>

                    <a href="#">
                        <span>⚔️</span>
                        Habilidades
                    </a>

                    <a href="#">
                        <span>🔥</span>
                        Ataques
                    </a>

                    <a href="#">
                        <span>🏆</span>
                        Logros
                    </a>

                    <a href="#">
                        <span>👤</span>
                        Perfil
                    </a>

                </nav>

            </aside>

        </section>


        <!-- INFORMACIÓN -->
        <section class="menuIzqueerdo">

            <div class="panel-info">

                <div class="tarjeta-info tiempo">
                    <span>⏱ TIEMPO</span>
                    <strong id="tiempoRest">0</strong>
                </div>

                <div class="tarjeta-info puntaje">
                    <span>★ PUNTAJE</span>
                    <strong id="puntaje">0</strong>
                </div>

                <div class="tarjeta-info estado">
                    <span>〽 ESTADO</span>
                    <strong id="estado">Listo</strong>
                </div>

            </div>

        </section>


        <!-- JUEGO -->
        <main class="contenedor">

            <section class="cabecera-juego">

                <h1>JUEGO DE LA SERPIENTE</h1>

                <p class="descripcion">
                    Eres una serpiente que busca sobrevivir comiendo todo
                    lo que pueda antes de que el tiempo se acabe.
                </p>

            </section>

            <canvas
                id="canvasJuego"
                height="600"
                width="600"
                class="canvass">
            </canvas>

            <p id="mensajeLevel" class="mensaje">
                NIVEL 1, principiante
            </p>

        </main>


        <!-- CONTROLES -->
        <section class="menuDerecho">

            <h2>CONTROLES</h2>

            <div class="controles">

                <button class="vacio"></button>

                <button onclick="cambiarDireccion('arriba')">
                    <span class="flecha">⬆</span>
                    <span>W</span>
                </button>

                <button class="vacio"></button>


                <button onclick="cambiarDireccion('izquierda')">
                    <span class="flecha">⬅</span>
                    <span>A</span>
                </button>

                <button onclick="pausarJuego()">
                    <span class="flecha">⏸</span>
                    <span>SPACE</span>
                </button>

                <button onclick="cambiarDireccion('derecha')">
                    <span class="flecha">➡</span>
                    <span>D</span>
                </button>


                <button class="vacio"></button>

                <button onclick="cambiarDireccion('abajo')">
                    <span class="flecha">⬇</span>
                    <span>S</span>
                </button>

                <button class="vacio"></button>

            </div>


            <div class="acciones">

                <button onclick="iniciarJuego()">
                    ▶ Iniciar
                </button>

                <button
                    class="secundario"
                    onclick="reiniciarJuego()">
                    ↻ Reiniciar
                </button>

            </div>

        </section>

    </div>
    <script src="serpiente.js"></script>

</body>
</html>
